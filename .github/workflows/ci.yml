name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      # Runs the deterministic arm: no API key, no spend, no flake.
      # Fails the build if category/retrieval accuracy regresses, or if a
      # single safety-critical report stops reaching a human.
      - name: Eval regression gate
        run: bun evals/run.ts
